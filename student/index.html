<!doctype html><html lang="ko" data-role="student"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피타고라스 정리</title>
<style>
:root{--n:#1b2a4a;--b:#3b6ea5;--l:#e8f1fa;--g:#eef0f3;--bd:#d5dbe3}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.5 system-ui,'Noto Sans KR',sans-serif;color:var(--n);background:#fcfbf7}
button{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--n)}
button.p{background:var(--n);color:#fff;border-color:var(--n)}button:disabled{opacity:.4;cursor:not-allowed}button.on{background:var(--l);border-color:var(--b)}
input,textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;width:100%;color:var(--n)}textarea{resize:none}
a.btn{display:block;padding:12px;border-radius:10px;border:1px solid var(--n);color:var(--n);text-decoration:none;margin:8px 0}a.btn.p{background:var(--n);color:#fff}
.c{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:0}
#app{height:100%;display:flex;flex-direction:column}.ctr{margin:auto;text-align:center;max-width:380px;width:90%}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--bd);background:#fff;flex-wrap:wrap}
header b{font-size:15px}.st{display:flex;gap:6px;flex:1}.st button{border-radius:20px;padding:3px 10px;font-size:12px}
.st .cur{background:var(--n);color:#fff}.st .dn{background:var(--l)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:65fr 35fr;gap:10px;padding:10px}.main>*{overflow:auto}
.left{display:flex;flex-direction:column;gap:6px}.fig{flex:1;min-height:0}.fig svg{width:100%;height:100%;display:block;touch-action:none}
footer{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--bd);background:#fff}
.right label{display:block;font-weight:600;margin:6px 0 2px}.ok{color:#1a7f4b;font-weight:700}.no{color:#b3261e}
.small{font-size:12px;color:#5b6679}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}tr.h{cursor:pointer}tr.h:hover{background:var(--l)}
.dash{padding:12px;overflow:auto;flex:1}.stats{display:flex;gap:10px;margin-bottom:10px}.stats .c{flex:1}.stats b{font-size:22px;display:block}
@media(max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:55fr 45fr}}
</style></head><body><div id="app"></div>
<script src="../config.js"></script>
<script>
const C=window.CFG||{},$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cfgOk=C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!/YOUR/.test(C.SUPABASE_URL+C.SUPABASE_ANON_KEY);
async function rpc(fn,a){const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:C.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});if(!r.ok)throw new Error(await r.text());return r.json()}
const ALL=[[2,1,5],[2,2,8],[3,2,13],[3,3,18],[4,1,17],[5,2,29],[6,4,52]],BASE=ALL.slice(0,3),EXT=ALL.slice(3),HID=[2,0,1,2,0,1],NAMES=['관찰하기','관계 발견하기','생각 정리하기','적용하기'];
const key=t=>t.join('-');
// ---------- 기하 (a=3,b=4,c=5, 큰 정사각형 한 변 7) ----------
const SH=[[0,0],[4,0],[0,3]],T1=[{x:0,y:0,r:0},{x:7,y:0,r:1},{x:7,y:7,r:2},{x:0,y:7,r:3}];
const tv=t=>{let p=SH;for(let i=0;i<t.r;i++)p=p.map(([x,y])=>[-y,x]);return p.map(([x,y])=>[x+t.x,y+t.y])};
function inT(x,y,v){const s=(a,b)=>(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);const d=[s(v[0],v[1]),s(v[1],v[2]),s(v[2],v[0])];return d.every(k=>k>0)||d.every(k=>k<0)}
const sqf=(x0,y0,s)=>(x,y)=>x>x0&&x<x0+s&&y>y0&&y<y0+s;
const TA=[[4,0],[7,4],[3,7]],TB=[[4,0],[3,7],[0,3]];
const inQ=(x,y,q)=>{const d=q.map((a,i)=>{const b=q[(i+1)%4];return (b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0])});return d.every(k=>k>0)||d.every(k=>k<0)};
const F1=(x,y)=>inQ(x,y,[[4,0],[7,4],[3,7],[0,3]]);
const F2=[[sqf(0,0,4),sqf(4,4,3)],[sqf(0,0,3),sqf(3,3,4)],[sqf(3,0,4),sqf(0,4,3)],[sqf(4,0,3),sqf(0,3,4)]].map(([a,b])=>(x,y)=>a(x,y)||b(x,y));
function an(T){const V=T.map(tv),inb=V.every(v=>v.every(([x,y])=>x>=0&&x<=7&&y>=0&&y<=7)),ov=[],gap=[];
 for(let i=0;i<28;i++)for(let j=0;j<28;j++){const x=(i+.5)/4,y=(j+.5)/4,k=V.filter(v=>inT(x,y,v)).length;if(k>1)ov.push([x,y]);if(!k)gap.push([x,y])}
 let kind='bad',fi=-1;if(inb&&!ov.length){const un=f=>{for(let i=0;i<28;i++)for(let j=0;j<28;j++){const x=(i+.5)/4,y=(j+.5)/4;if(!V.some(v=>inT(x,y,v))!==!!f(x,y))return false}return true};kind=un(F1)?'arr1':(fi=F2.findIndex(un))>=0?'arr2':'ok'}
 return{V,ov,gap,kind,inb,fi}}
const CEN=[[[2,2,'b²'],[5.5,5.5,'a²']],[[1.5,1.5,'a²'],[5,5,'b²']],[[5,2,'b²'],[1.5,5.5,'a²']],[[5.5,1.5,'a²'],[2,5,'b²']]];
function GL(a){const t=(x,y,l)=>`<text x="${x}" y="${y}" font-size=".7" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a4a" pointer-events="none">${l}</text>`;return a.kind=='arr1'?t(3.5,3.5,'c²'):a.kind=='arr2'?CEN[a.fi].map(([x,y,l])=>t(x,y,l)).join(''):''}
function LBL(T,a){const tx=(x,y,l,ex='')=>`<text x="${x}" y="${y}" ${ex} font-size=".42" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#b3261e" paint-order="stroke" stroke="#fff" stroke-width=".1" pointer-events="none">${l}</text>`;
 return T.map((t,i)=>{const v=a.V[i],cx=(v[0][0]+v[1][0]+v[2][0])/3,cy=(v[0][1]+v[1][1]+v[2][1])/3;return [[0,2,'a'],[0,1,'b'],[1,2,'c']].map(([m,n,l])=>{const mx=(v[m][0]+v[n][0])/2,my=(v[m][1]+v[n][1])/2,dx=cx-mx,dy=cy-my,d=Math.hypot(dx,dy)||1;return tx(mx+dx/d*.3,my+dy/d*.3,l)}).join('')}).join('')+tx(3.5,-.15,'a + b')+tx(-.15,3.5,'a + b','transform="rotate(-90 -.15 3.5)"')}
function sq2(T,a,sel,gl){return `<defs><pattern id="gp" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#d5dbe3" stroke-width=".03"/></pattern></defs><rect width="7" height="7" fill="#fff"/><rect width="7" height="7" fill="url(#gp)"/>`+
 a.gap.map(([x,y])=>`<rect x="${x-.125}" y="${y-.125}" width=".25" height=".25" fill="#fff0b8"/>`).join('')+
 T.map((t,i)=>`<polygon data-i="${i}" points="${a.V[i].join(' ')}" fill="${i===sel?'#7fa9d6':'#a9c7e8'}" fill-opacity=".92" stroke="#1b2a4a" stroke-width=".06" stroke-linejoin="round" style="cursor:grab"/>`).join('')+
 a.ov.map(([x,y])=>`<rect x="${x-.125}" y="${y-.125}" width=".25" height=".25" fill="#d93025" fill-opacity=".6"/>`).join('')+`<rect width="7" height="7" fill="none" stroke="#1b2a4a" stroke-width=".1"/>`+LBL(T,a)+(gl?GL(a):'')}
const svg2=(T,a,sel,id,gl)=>`<svg ${id?`id="${id}"`:''} viewBox="-.4 -.4 7.8 7.8">${sq2(T,a,sel,gl)}</svg>`;
// ---------- 1·4단계: 직각삼각형과 정사각형 ----------
function triSvg(p,q,c,sel,lab,click){const B=[p,0],Cc=[0,-q],n=[q,-p],S=[[[0,0],[p,0],[p,p],[0,p]],[[0,0],[0,-q],[-q,-q],[-q,0]],[B,Cc,[Cc[0]+n[0],Cc[1]+n[1]],[B[0]+n[0],B[1]+n[1]]]],
 ct=S.map(s=>[s.reduce((a,v)=>a+v[0],0)/4,s.reduce((a,v)=>a+v[1],0)/4]),f=(p+q+Math.max(p,q))/16,x0=-q-1,y0=-q-p-1,w=p+2*q+2,h=q+2*p+2;
 return `<svg viewBox="${x0} ${y0} ${w} ${h}"><defs><pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#cfd6e0" stroke-width=".03"/></pattern><pattern id="g2" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#8d9bb0" stroke-opacity=".45" stroke-width=".03"/></pattern></defs><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff"/><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#g1)"/>`+
 S.map((s,i)=>`<polygon ${click?`onclick="pick(${i})" style="cursor:pointer"`:''} points="${s.join(' ')}" fill="${i===sel?'#9ec1e6':['#e8f1fa','#eef0f3','#dfe9f6'][i]}" stroke="#1b2a4a" stroke-width="${f/12}"/><polygon points="${s.join(' ')}" fill="url(#g2)" stroke="none" pointer-events="none"/><text x="${ct[i][0]}" y="${ct[i][1]}" font-size="${f}" text-anchor="middle" dominant-baseline="middle" fill="#1b2a4a" pointer-events="none">${lab[i]}</text>`).join('')+
 `<polygon points="0,0 ${p},0 0,${-q}" fill="#fff" stroke="#1b2a4a" stroke-width="${f/8}"/><path d="M0 0h${f/3}v${-f/3}h${-f/3}z" fill="none" stroke="#1b2a4a" stroke-width="${f/16}"/></svg>`}
// ---------- 상태 ----------
let S=null,D=null,cur=1,ti=0,selq=-1,cv=false,sel2=-1,stat='';
const def=()=>({obs:{a:{},s:{},extra:[],guess:''},rel:{t:T1.map(t=>({...t})),v1:false,cmp:false,fin:null,t1:'',t2:''},app:{ord:[],ans:{},r:['','',''],ex:0}});
function shuf(){const f=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};return[...f([0,1,2]),...f([3,4,5])]}

const six=()=>BASE.every(t=>[0,1,2].every(j=>aok(key(t),j)));
const cval=(k,j)=>{const t=ALL.find(x=>key(x)===k);return t?String([t[0]**2,t[1]**2,t[2]][j]):''};
const aok=(k,j)=>{const v=D.obs.s?.[k]?.[j];return v!==undefined&&String(v)===cval(k,j)&&String(D.obs.a[k]?.[j]??'')===String(v)};
const done1=()=>six();
const prob=k=>{const[p,q,c]=ALL[D.app.ord[k]],ar=[p*p,q*q,c],h=HID[k];return{p,q,c,ar,h,ans:ar[h]}};
const L=(v,n)=>{v=(v||'').trim().replace(/\s/g,'');if(v.length<n||/^(.{1,3})\1+$/.test(v))return false;const m={};for(const ch of v)m[ch]=(m[ch]||0)+1;return Object.keys(m).length>=3&&Math.max(...Object.values(m))/v.length<=.5},basicOk=i=>String(D.app.ans[i]??'')==String(prob(i).ans);
const c=k=>k==1?D.rel.v1&&D.rel.cmp:k==2?false:0;
const comp=k=>k==1?six():k==2?D.rel.v1&&D.rel.cmp:[0,1,2].every(basicOk);
const allDone=()=>STG.every(comp);
let q=[],tm;const ev=(step,kind,payload)=>q.push({step,kind,payload,at:new Date().toISOString()});
const lg=(step,k,v)=>{ev(step,'ans',{k,v});save(1)};
function save(now){clearTimeout(tm);stat='저장 중…';tm=setTimeout(flush,now?0:600)}
async function flush(){const evs=q.splice(0);try{const r=await rpc('student_save',{p_token:S.token,p_data:D,p_max:S.max,p_done:allDone(),p_events:evs});if(r&&r.open!=null)S.open=r.open;stat='저장됨 ✓'}catch(e){if(/locked/.test(e.message)){stat='⚠ 선생님이 열지 않은 단계예요';spoll()}else{q.unshift(...evs);stat='⚠ 저장 실패 (연결 확인)'}}const s=$('#stat');if(s)s.textContent=stat}
// ---------- 라우팅 ----------

function home(){A.innerHTML=`<div class="ctr"><h1 style="margin:0 0 6px">피타고라스 정리</h1><p>도형 속에 숨겨진 수학적 관계를 발견해 보자.</p><a class="btn p" href="student/">학생으로 입장하기</a><a class="btn" href="teacher/">선생님으로 입장하기</a></div>`}
function warn(){return cfgOk?'':`<p class="no">Supabase 설정(config.js)이 없어 저장·입장을 할 수 없습니다.</p>`}
function loginS(){A.innerHTML=`<div class="ctr c" style="padding:24px"><h2 style="margin-top:0">학생 입장</h2>${warn()}<input id="cl" placeholder="반 코드 (선생님이 알려 준 코드)"><br><br><input id="no" placeholder="학번 (예: 20105)"><br><br><input id="nm" placeholder="이름"><p id="er" class="no"></p><button class="p" id="go" ${cfgOk?'':'disabled'}>입장하기</button></div>`;
 $('#go').onclick=async()=>{const cls=$('#cl').value.trim().toUpperCase(),no=$('#no').value.trim(),nm=$('#nm').value.trim();if(!cls||!no||!nm){$('#er').textContent='반 코드, 학번, 이름을 모두 입력하세요.';return}if(!/^[A-Z0-9가-힣_-]{1,20}$/.test(cls)){$('#er').textContent='반 코드는 글자·숫자·-·_ 만 쓸 수 있어요.';return}
  try{const r=await rpc('student_login',{p_class:cls,p_no:no,p_name:nm});S={id:r.id,token:r.token,no,nm,cls,max:Math.min(r.max_step,3),open:r.open};const d=def(),g=r.data||{};D={obs:{...d.obs,...g.obs},rel:{...d.rel,...g.rel},app:{...d.app,...g.app}};if(!(D.app.ord.length==6&&[0,1,2].every(i=>D.app.ord.slice(0,3).includes(i)))){D.app.ord=shuf();D.app.ans={};D.app.ex=0}cur=Math.max(...STG.filter(allowed));student();setInterval(spoll,8000)}catch(e){$('#er').textContent='입장 실패: '+e.message}}}
function need(k){const r=[];
if(k==1)BASE.forEach((t,i)=>{const n=[0,1,2].filter(j=>!aok(key(t),j)).length;r.push([!n,n?`삼각형 ${i+1}: 정사각형 넓이 ${n}개를 입력하고 '확인하기'로 제출해 주세요`:`삼각형 ${i+1} 넓이 입력 완료`])});
if(k==2){const a=an(D.rel.t).kind=='arr2'||D.rel.cmp;r.push([a,a?'두 번째 배치 완성':'두 번째 배치를 완성해 주세요 (가운데에 두 정사각형이 남도록)']);r.push([D.rel.cmp,D.rel.cmp?'두 배치 비교 완료':"두 번째 배치를 완성한 후 '두 배치 비교하기'를 눌러 주세요"])}
if(k==3){const u=[0,1,2].filter(i=>!basicOk(i)).map(i=>i+1);r.push([!u.length,u.length?`기본 문제 중 아직 풀지 않은 문제가 있습니다 (문제 ${u.join(', ')})`:'기본 문제 3개 완료'])}
const nn=nextOf(k);if(comp(k)&&nn&&nn>S.open)r.push([false,'선생님이 다음 단계를 열어 줄 때까지 기다려 주세요 (자동으로 확인 중)']);
return r}
// ---------- 학생 화면 ----------
function student(){A.innerHTML=`<header><b>피타고라스 정리</b><div class="st" id="st"></div><span class="small">${esc(S.cls)}반 · 학번 ${esc(S.no)} · ${esc(S.nm)} · <span id="stat">${esc(stat)}</span></span></header><div class="main" id="mn"></div><footer id="ft"></footer>`;view()}
function upd(){$('#st').innerHTML=STG.map(n=>`<button class="${n===cur?'cur':comp(n)?'dn':''}" ${allowed(n)?'':'disabled'} onclick="go(${n})">0${n} ${NM[n]}${comp(n)&&n!==cur?' ✓':''}</button>`).join('');
 $('#ft').innerHTML=`<button onclick="go(prevOf(cur))" ${cur<2?'disabled':''}>← 이전</button><div class="small" style="flex:1;margin:0 12px;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center">${need(cur).map(([o,t])=>`<span class="${o?'ok':'no'}">${o?'✓':'○'} ${t}</span>`).join('')}</div><button class="p" onclick="nx()" ${comp(cur)&&(!nextOf(cur)||nextOf(cur)<=S.open)?'':'disabled'}>${nextOf(cur)?'다음 →':'수업 완료'}</button>`}
const STG=[1,2,3],NM={1:'관찰하기',2:'관계 발견하기',3:'적용하기'},nextOf=n=>STG[STG.indexOf(n)+1],prevOf=n=>STG[STG.indexOf(n)-1],allowed=n=>n<=S.max&&n<=S.open;
function go(n){if(!allowed(n))return;cur=n;view()}
function nx(){if(!comp(cur))return;const nn=nextOf(cur);if(!nn){$('#mn').innerHTML=`<div class="c ctr" style="grid-column:1/-1"><h2>수업을 모두 마쳤어요 🎉</h2><p>${esc(S.nm)} 학생의 모든 활동이 저장되었습니다. 이전 단계로 돌아가 답을 고칠 수도 있어요.</p></div>`;save(1);return}if(nn>S.open)return;S.max=Math.max(S.max,nn);cur=nn;save(1);view()}
function lockView(){$('#mn').innerHTML=`<div class="c ctr" style="grid-column:1/-1"><h2>선생님이 아직 열지 않은 단계예요</h2><p>선생님이 열어 주면 자동으로 이동할 수 있어요. 앞 단계에서 내용을 다시 확인하며 기다려 주세요.</p></div>`;upd()}
async function spoll(){try{const r=await rpc('student_state',{p_token:S.token}),ch=r.open!==S.open;S.open=r.open;if(ch){if(cur>S.open)lockView();else upd()}}catch(e){}}
function view(){if(cur>S.open){lockView();return}upd();({1:v1,2:v2,3:v4})[cur]();upd()}
// 1단계
const xl=()=>[...BASE,...D.obs.extra.map(k=>ALL.find(x=>key(x)===k)).filter(x=>x&&!BASE.includes(x))];
function v1(){const o=D.obs,list=xl(),t=list[ti]||list[0],[p,qq]=t,k=key(t),names=['아래쪽 정사각형','왼쪽 정사각형','빗변 쪽 정사각형'];
 $('#mn').innerHTML=`<div class="c left"><div class="row">${list.map((x,i)=>`<button class="${i===ti?'on':''}" onclick="ti=${i};selq=-1;v1()">${i<3?'삼각형 '+(i+1):'추가 '+(i-2)}</button>`).join('')}<button onclick="more()" ${EXT.every(x=>o.extra.includes(key(x)))?'disabled':''}>다른 삼각형 살펴보기</button></div>
 <div class="fig">${triSvg(p,qq,0,selq,['','',''],1)}</div><div class="small">모눈종이 위의 삼각형과 세 정사각형을 관찰해 보세요. 정사각형을 누르면 선택한 정사각형이 표시돼요. (모눈 한 칸의 넓이 = 1)</div></div>
