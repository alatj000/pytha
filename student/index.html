<!doctype html><html lang="ko" data-role="student"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피타고라스 정리</title>
<style>
:root{--n:#1b2a4a;--b:#3b6ea5;--l:#e8f1fa;--g:#eef0f3;--bd:#d5dbe3}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.5 system-ui,'Noto Sans KR',sans-serif;color:var(--n);background:#fcfbf7}
button{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--n)}
button.p{background:var(--n);color:#fff;border-color:var(--n)}button:disabled{opacity:.4;cursor:not-allowed}button.on{background:var(--l);border-color:var(--b)}
input,textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;width:100%;color:var(--n)}textarea{resize:none}
a.btn{display:block;padding:12px;border-radius:10px;border:1px solid var(--n);color:var(--n);text-decoration:none;margin:8px 0}a.btn.p{background:var(--n);color:#fff}
.c{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:0}
#app{height:100%;display:flex;flex-direction:column}.ctr{margin:auto;text-align:center;max-width:380px;width:90%}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--bd);background:#fff;flex-wrap:wrap}
header b{font-size:15px}.st{display:flex;gap:6px;flex:1}.st button{border-radius:20px;padding:3px 10px;font-size:12px}
.st .cur{background:var(--n);color:#fff}.st .dn{background:var(--l)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:65fr 35fr;gap:10px;padding:10px}.main>*{overflow:auto}
.left{display:flex;flex-direction:column;gap:6px}.fig{flex:1;min-height:0}.fig svg{width:100%;height:100%;display:block;touch-action:none}
footer{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--bd);background:#fff}
.right label{display:block;font-weight:600;margin:6px 0 2px}.ok{color:#1a7f4b;font-weight:700}.no{color:#b3261e}
.small{font-size:12px;color:#5b6679}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}tr.h{cursor:pointer}tr.h:hover{background:var(--l)}
.dash{padding:12px;overflow:auto;flex:1}.stats{display:flex;gap:10px;margin-bottom:10px}.stats .c{flex:1}.stats b{font-size:22px;display:block}
@media(max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:55fr 45fr}}
</style></head><body><div id="app"></div>
<script src="../config.js"></script>
<script>
const C=window.CFG||{},$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cfgOk=C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!/YOUR/.test(C.SUPABASE_URL+C.SUPABASE_ANON_KEY);
async function rpc(fn,a){const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:C.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});if(!r.ok)throw new Error(await r.text());return r.json()}
const ALL=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25],[9,12,15]],BASE=ALL.slice(0,3),EXT=ALL.slice(3),HID=[2,0,2,1,2,0],NAMES=['관찰하기','관계 발견하기','생각 정리하기','적용하기'];
const key=t=>t.join('-');
// ---------- 기하 (a=3,b=4,c=5, 큰 정사각형 한 변 7) ----------
const SH=[[0,0],[4,0],[0,3]],T1=[{x:0,y:0,r:0},{x:7,y:0,r:1},{x:7,y:7,r:2},{x:0,y:7,r:3}];
const tv=t=>{let p=SH;for(let i=0;i<t.r;i++)p=p.map(([x,y])=>[-y,x]);return p.map(([x,y])=>[x+t.x,y+t.y])};
function inT(x,y,v){const s=(a,b)=>(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);const d=[s(v[0],v[1]),s(v[1],v[2]),s(v[2],v[0])];return d.every(k=>k>0)||d.every(k=>k<0)}
const sqf=(x0,y0,s)=>(x,y)=>x>x0&&x<x0+s&&y>y0&&y<y0+s;
const TA=[[4,0],[7,4],[3,7]],TB=[[4,0],[3,7],[0,3]];
const F1=(x,y)=>inT(x,y,TA)||inT(x,y,TB);
const F2=[[sqf(0,0,4),sqf(4,4,3)],[sqf(0,0,3),sqf(3,3,4)],[sqf(3,0,4),sqf(0,4,3)],[sqf(4,0,3),sqf(0,3,4)]].map(([a,b])=>(x,y)=>a(x,y)||b(x,y));
function an(T){const V=T.map(tv),inb=V.every(v=>v.every(([x,y])=>x>=0&&x<=7&&y>=0&&y<=7)),ov=[],gap=[];
 for(let i=0;i<28;i++)for(let j=0;j<28;j++){const x=(i+.5)/4,y=(j+.5)/4,k=V.filter(v=>inT(x,y,v)).length;if(k>1)ov.push([x,y]);if(!k)gap.push([x,y])}
 let kind='bad';if(inb&&!ov.length){const un=f=>{for(let i=0;i<28;i++)for(let j=0;j<28;j++){const x=(i+.5)/4,y=(j+.5)/4;if(!V.some(v=>inT(x,y,v))!==!!f(x,y))return false}return true};kind=un(F1)?'arr1':F2.some(un)?'arr2':'ok'}
 return{V,ov,gap,kind,inb}}
function sq2(T,a,sel){return `<defs><pattern id="gp" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#d5dbe3" stroke-width=".03"/></pattern></defs><rect width="7" height="7" fill="#fff"/><rect width="7" height="7" fill="url(#gp)"/>`+
 a.gap.map(([x,y])=>`<rect x="${x-.125}" y="${y-.125}" width=".25" height=".25" fill="#fff0b8"/>`).join('')+
 T.map((t,i)=>`<polygon data-i="${i}" points="${a.V[i].join(' ')}" fill="${i===sel?'#7fa9d6':'#a9c7e8'}" fill-opacity=".92" stroke="#1b2a4a" stroke-width=".06" stroke-linejoin="round" style="cursor:grab"/>`).join('')+
 a.ov.map(([x,y])=>`<rect x="${x-.125}" y="${y-.125}" width=".25" height=".25" fill="#d93025" fill-opacity=".6"/>`).join('')+`<rect width="7" height="7" fill="none" stroke="#1b2a4a" stroke-width=".1"/>`}
const svg2=(T,a,sel,id)=>`<svg ${id?`id="${id}"`:''} viewBox="-.4 -.4 7.8 7.8">${sq2(T,a,sel)}</svg>`;
// ---------- 1·4단계: 직각삼각형과 정사각형 ----------
function triSvg(p,q,c,sel,lab,click){const B=[p,0],Cc=[0,-q],n=[q,-p],S=[[[0,0],[p,0],[p,p],[0,p]],[[0,0],[0,-q],[-q,-q],[-q,0]],[B,Cc,[Cc[0]+n[0],Cc[1]+n[1]],[B[0]+n[0],B[1]+n[1]]]],
 ct=S.map(s=>[s.reduce((a,v)=>a+v[0],0)/4,s.reduce((a,v)=>a+v[1],0)/4]),f=(p+q+c)/16,x0=-q-1,y0=-q-p-1,w=p+2*q+2,h=q+2*p+2;
 return `<svg viewBox="${x0} ${y0} ${w} ${h}"><defs><pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#cfd6e0" stroke-width=".03"/></pattern></defs><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff"/><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#g1)"/>`+
 S.map((s,i)=>`<polygon ${click?`onclick="pick(${i})" style="cursor:pointer"`:''} points="${s.join(' ')}" fill="${i===sel?'#9ec1e6':['#e8f1fa','#eef0f3','#dfe9f6'][i]}" stroke="#1b2a4a" stroke-width="${f/12}"/><text x="${ct[i][0]}" y="${ct[i][1]}" font-size="${f}" text-anchor="middle" dominant-baseline="middle" fill="#1b2a4a" pointer-events="none">${lab[i]}</text>`).join('')+
 `<polygon points="0,0 ${p},0 0,${-q}" fill="#fff" stroke="#1b2a4a" stroke-width="${f/8}"/><path d="M0 0h${f/3}v${-f/3}h${-f/3}z" fill="none" stroke="#1b2a4a" stroke-width="${f/16}"/></svg>`}
// ---------- 상태 ----------
let S=null,D=null,cur=1,ti=0,selq=-1,cv=false,sel2=-1,stat='';
const def=()=>({obs:{a:{},extra:[],guess:''},rel:{t:T1.map(t=>({...t})),v1:false,cmp:false,fin:null,t1:'',t2:''},app:{ord:[],ans:{},r:['','','']}});
function shuf(){const a=[0,1,2,3,4,5];for(let i=5;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gok=s=>s.length>=15&&/넓이/.test(s)&&/(같|합|더|\+|=)/.test(s)&&!/\(\s*\)/.test(s);
const aok=(k,j)=>{const[t]=[ALL.find(x=>key(x)===k)];const v=[t[0]**2,t[1]**2,t[2]**2][j];return String(D.obs.a[k]?.[j]??'')===String(v)};
const done1=()=>BASE.every(t=>[0,1,2].every(j=>aok(key(t),j)))&&D.obs.extra.length>0&&D.obs.extra.some(k=>[0,1,2].every(j=>aok(k,j)))&&gok(D.obs.guess);
const prob=k=>{const[p,q,c]=ALL[D.app.ord[k]],ar=[p*p,q*q,c*c],h=HID[k];return{p,q,c,ar,h,ans:ar[h]}};
const rok=s=>(s||'').trim().length>=12;
const c=k=>k==1?D.rel.v1&&D.rel.cmp:k==2?false:0;
const comp=k=>k==1?done1():k==2?D.rel.v1&&D.rel.cmp:k==3?rok(D.rel.t1)&&rok(D.rel.t2)&&/넓이/.test(D.rel.t2):[0,1,2,3,4,5].every(i=>String(D.app.ans[i]??'')==String(prob(i).ans))&&D.app.r.every(rok)&&/넓이|제곱|합/.test(D.app.r[1]);
const allDone=()=>[1,2,3,4].every(comp);
let q=[],tm;const ev=(step,kind,payload)=>q.push({step,kind,payload,at:new Date().toISOString()});
const lg=(step,k,v)=>{ev(step,'ans',{k,v});save(1)};
function save(now){clearTimeout(tm);stat='저장 중…';tm=setTimeout(flush,now?0:600)}
async function flush(){const evs=q.splice(0);try{await rpc('student_save',{p_token:S.token,p_data:D,p_max:S.max,p_done:allDone(),p_events:evs});stat='저장됨 ✓'}catch(e){q.unshift(...evs);stat='⚠ 저장 실패 (연결 확인)'}const s=$('#stat');if(s)s.textContent=stat}
// ---------- 라우팅 ----------
const R=document.documentElement.dataset.role;if(R==='student')loginS();else if(R==='teacher')loginT();else home();
function home(){A.innerHTML=`<div class="ctr"><h1 style="margin:0 0 6px">피타고라스 정리</h1><p>도형 속에 숨겨진 수학적 관계를 발견해 보자.</p><a class="btn p" href="student/">학생으로 입장하기</a><a class="btn" href="teacher/">선생님으로 입장하기</a></div>`}
function warn(){return cfgOk?'':`<p class="no">Supabase 설정(config.js)이 없어 저장·입장을 할 수 없습니다.</p>`}
function loginS(){A.innerHTML=`<div class="ctr c" style="padding:24px"><h2 style="margin-top:0">학생 입장</h2>${warn()}<input id="no" placeholder="학번 (예: 20105)"><br><br><input id="nm" placeholder="이름"><p class="small">같은 학번·이름으로 다시 들어오면 이전 기록에서 이어서 학습합니다. 학번이 같아도 이름이 다르면 서로 다른 학생으로 기록됩니다.</p><p id="er" class="no"></p><button class="p" id="go" ${cfgOk?'':'disabled'}>입장하기</button></div>`;
 $('#go').onclick=async()=>{const no=$('#no').value.trim(),nm=$('#nm').value.trim();if(!no||!nm){$('#er').textContent='학번과 이름을 모두 입력하세요.';return}
  try{const r=await rpc('student_login',{p_no:no,p_name:nm});S={id:r.id,token:r.token,no,nm,max:r.max_step};const d=def(),g=r.data||{};D={obs:{...d.obs,...g.obs},rel:{...d.rel,...g.rel},app:{...d.app,...g.app}};if(!D.app.ord.length)D.app.ord=shuf();cur=S.max;student();setInterval(()=>save(1),30000)}catch(e){$('#er').textContent='입장 실패: '+e.message}}}
// ---------- 학생 화면 ----------
function student(){A.innerHTML=`<header><b>피타고라스 정리</b><div class="st" id="st"></div><span class="small">학번 ${esc(S.no)} · ${esc(S.nm)} · <span id="stat">${esc(stat)}</span></span></header><div class="main" id="mn"></div><footer id="ft"></footer>`;view()}
function upd(){$('#st').innerHTML=NAMES.map((n,i)=>`<button class="${i+1===cur?'cur':comp(i+1)?'dn':''}" ${i+1>S.max?'disabled':''} onclick="go(${i+1})">0${i+1} ${n}${comp(i+1)&&i+1!==cur?' ✓':''}</button>`).join('');
 $('#ft').innerHTML=`<button onclick="go(cur-1)" ${cur<2?'disabled':''}>← 이전</button><button class="p" onclick="nx()" ${comp(cur)?'':'disabled'}>${cur==4?'수업 완료':'다음 →'}</button>`}
function go(n){if(n<1||n>S.max)return;cur=n;view()}
function nx(){if(!comp(cur))return;if(cur==4){$('#mn').innerHTML=`<div class="c ctr" style="grid-column:1/-1"><h2>수업을 모두 마쳤어요 🎉</h2><p>${esc(S.nm)} 학생의 모든 활동이 저장되었습니다. 이전 단계로 돌아가 답을 고칠 수도 있어요.</p></div>`;save(1);return}
 S.max=Math.max(S.max,cur+1);cur++;save(1);view()}
function view(){upd();[0,v1,v2,v3,v4][cur]();upd()}
// 1단계
function v1(){const o=D.obs,list=[...BASE,...EXT.slice(0,o.extra.length)],t=list[ti]||list[0],[p,qq,cc]=t,k=key(t);const names=['아래쪽 정사각형 (한 변 '+p+')','왼쪽 정사각형 (한 변 '+qq+')','빗변 쪽 정사각형 (한 변 '+cc+')'];
 $('#mn').innerHTML=`<div class="c left"><div class="row">${list.map((x,i)=>`<button class="${i===ti?'on':''}" onclick="ti=${i};selq=-1;v1()">${x[0]}, ${x[1]}, ${x[2]}${i>2?' (추가)':''}</button>`).join('')}<button onclick="more()" ${o.extra.length>=3?'disabled':''}>다른 삼각형 살펴보기</button></div>
 <div class="fig">${triSvg(p,qq,cc,selq,[p,qq,cc].map(v=>'한 변 '+v),1)}</div><div class="small">정사각형을 눌러 보세요. ${selq>=0?'<b>'+names[selq]+'</b> → 넓이는 한 변의 길이를 두 번 곱한 값, 모눈 한 칸이 1이에요.':'세 정사각형은 직각삼각형의 세 변에 각각 붙어 있어요. (모눈 한 칸 = 길이 1)'}</div></div>
 <div class="c right"><b>${t.join(', ')} 삼각형의 정사각형 넓이</b>${names.map((n,j)=>`<label>${n.split(' (')[0]} 넓이 <span id="m${j}"></span></label><input id="a${j}" inputmode="numeric" value="${esc(o.a[k]?.[j]??'')}" oninput="setA('${k}',${j},this.value)" onchange="lg(1,'a:${k}:${j}',this.value)">`).join('')}
 <label>여러 삼각형을 관찰해 보니, 세 정사각형의 넓이 사이에는 어떤 관계가 있는 것 같나요?</label><textarea id="gs" rows="4" placeholder="내 생각을 문장으로 써 보세요" oninput="D.obs.guess=this.value;mk();save()" onchange="lg(1,'guess',this.value)">${esc(o.guess)}</textarea>
 <div class="row"><button onclick="tpl()">문장틀 넣기</button><span class="small" id="gh"></span></div><p class="small">필요 활동: 기본 3개 넓이 입력, 추가 삼각형 1개 이상 입력, 추측(15자 이상, '넓이'와 관계 표현 포함)</p></div>`;mk()}
function pick(i){selq=i;v1();$('#a'+i)?.focus()}
function more(){const n=D.obs.extra.length;D.obs.extra.push(key(EXT[n]));ti=3+n;selq=-1;ev(1,'extra',{t:key(EXT[n])});save(1);v1()}
function setA(k,j,v){D.obs.a[k]=D.obs.a[k]||['','',''];D.obs.a[k][j]=v.trim();mk();save()}
function tpl(){const g=$('#gs');if(!g.value){g.value='(한 직각변에 붙은 정사각형의 넓이) + (다른 직각변에 붙은 정사각형의 넓이) = ( ) 쪽 정사각형의 넓이';D.obs.guess=g.value}}
function mk(){const list=[...BASE,...EXT.slice(0,D.obs.extra.length)],t=list[ti]||list[0],k=key(t);[0,1,2].forEach(j=>{const m=$('#m'+j);if(m){const v=D.obs.a[k]?.[j];m.innerHTML=!v?'':aok(k,j)?'<span class="ok">✓ 맞아요</span>':'<span class="no">다시 계산해 봐요</span>'}});const h=$('#gh');if(h)h.textContent=gok(D.obs.guess)?'✓ 좋아요':'관계를 나타내는 말(같다, 합, 더하다…)과 \'넓이\'를 넣고 빈칸 ( )은 지워 주세요';upd()}
// 2단계
function v2(){if(!D.rel.v1){D.rel.v1=true;ev(2,'view1',{});save(1)}
 $('#mn').innerHTML=`<div class="c left" id="L"></div><div class="c right"><b>직각삼각형 4개의 자리를 바꿔 보세요</b><p>① 지금 배치(첫 번째): 큰 정사각형의 한 변은 3+4=7, 넓이 7×7=49. 삼각형 한 개의 넓이는 3×4÷2=6이라 네 개는 24. 가운데 남은 부분은 49−24=25 → 한 변이 5인 정사각형(빗변 c)이에요.</p><p>② 삼각형을 끌어서 옮기고 <b>회전</b>해서, 가운데에 <b>두 개의 정사각형</b>(한 변 3, 한 변 4)이 남게 만들어 보세요.</p><p>모눈 한 칸씩 딱 맞게 붙어요. 노란색 = 남는 부분, 빨간색 = 겹친 부분.</p><div id="msg" class="c" style="background:var(--g)"></div><div class="row" style="margin-top:8px"><button onclick="rot()">선택한 삼각형 회전</button><button onclick="rst()">처음 배치로 돌아가기</button><button class="p" id="cmpb" onclick="docmp()"></button></div></div>`;lay2()}
function lay2(){const L=$('#L');if(cv){L.innerHTML=cmpHtml(true);r2b();return}
 L.innerHTML=`<div class="fig"><svg id="bd" viewBox="-.4 -.4 7.8 7.8"></svg></div>`;bind2();r2()}
function r2b(){$('#cmpb').textContent='다시 조작하기';$('#cmpb').disabled=false;$('#msg').innerHTML='두 배치를 비교했어요. 아래 세 문장을 확인해 보세요.'}
function cmpHtml(){const a1=an(T1),a2=an(D.rel.fin||D.rel.t);return `<div style="display:flex;gap:8px;flex:1;min-height:0"><div style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="small" style="text-align:center">첫 번째 배치 (가운데: 빗변 정사각형)</div><div class="fig">${svg2(T1,a1)}</div></div><div style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="small" style="text-align:center">내가 만든 두 번째 배치 (가운데: 두 정사각형)</div><div class="fig">${svg2(D.rel.fin||D.rel.t,a2)}</div></div></div><div class="small"><b>① 바깥 큰 정사각형의 넓이는 같다(49). ② 안에 놓은 직각삼각형 4개도 같다. ③ 따라서 가운데 남은 부분의 넓이도 같다(25).</b></div>`}
function r2(){const T=D.rel.t,a=an(T),b=$('#bd');if(!b)return;b.innerHTML=sq2(T,a,sel2);const m=$('#msg');
 m.innerHTML=a.kind=='bad'?`<span class="no">${!a.inb?'큰 정사각형 밖으로 나갔어요.':'삼각형이 겹쳤어요(빨간색).'}</span>`:`남은 부분(노란색)의 넓이: <b>${a.gap.length/16}</b>${a.kind=='arr1'?' — 가운데에 한 변 5인 정사각형이 남았어요 (첫 번째 배치)':a.kind=='arr2'?' — 두 정사각형(3×3=9, 4×4=16)이 남았어요! 완성 ✓':''}`;
 const cb=$('#cmpb');cb.disabled=a.kind!='arr2'&&!D.rel.cmp;cb.textContent=cv?'다시 조작하기':'두 배치 비교하기';upd()}
const pt=(s,e)=>{const p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())};
function clamp(t){const v=tv(t),xs=v.map(a=>a[0]),ys=v.map(a=>a[1]);let a=Math.min(...xs),b=Math.max(...xs),c2=Math.min(...ys),d=Math.max(...ys);if(a<0)t.x-=a;if(b>7)t.x-=b-7;if(c2<0)t.y-=c2;if(d>7)t.y-=d-7}
function bind2(){const s=$('#bd');let dr=null;
 s.onpointerdown=e=>{const g=e.target.closest('[data-i]');if(!g)return;const i=+g.dataset.i,p=pt(s,e),t=D.rel.t[i];sel2=i;dr={i,ox:p.x-t.x,oy:p.y-t.y,x:t.x,y:t.y};s.setPointerCapture(e.pointerId);r2()};
 s.onpointermove=e=>{if(!dr)return;const p=pt(s,e),t=D.rel.t[dr.i];t.x=Math.round(p.x-dr.ox);t.y=Math.round(p.y-dr.oy);clamp(t);r2()};
 s.onpointerup=()=>{if(!dr)return;const t=D.rel.t[dr.i];if(t.x!=dr.x||t.y!=dr.y){ev(2,'move',{i:dr.i,x:t.x,y:t.y,r:t.r});save()}dr=null}}
function rot(){if(sel2<0||cv)return;const t=D.rel.t[sel2];t.r=(t.r+1)%4;clamp(t);ev(2,'rotate',{i:sel2,x:t.x,y:t.y,r:t.r});save();r2()}
function rst(){if(cv){cv=false;lay2();return}D.rel.t=T1.map(t=>({...t}));sel2=-1;ev(2,'reset',{});save();r2()}
function docmp(){if(cv){cv=false;lay2();r2();return}const a=an(D.rel.t);if(a.kind!='arr2')return;D.rel.cmp=true;D.rel.fin=D.rel.t.map(t=>({...t}));ev(2,'compare',{kind:a.kind});save(1);cv=true;lay2()}
// 3단계
function v3(){$('#mn').innerHTML=`<div class="c left">${cmpHtml()}</div><div class="c right"><b>생각 정리하기</b><label>두 가지 배치에서 공통적으로 유지되는 것은 무엇인가요?</label><textarea rows="4" oninput="D.rel.t1=this.value;upd();save()" onchange="lg(3,'t1',this.value)">${esc(D.rel.t1)}</textarea><label>그렇다면 가운데 남는 부분의 넓이 사이에는 어떤 관계가 성립할까요? (3, 4, 5로 설명해 봐도 좋아요)</label><textarea rows="5" oninput="D.rel.t2=this.value;upd();save()" onchange="lg(3,'t2',this.value)">${esc(D.rel.t2)}</textarea><p class="small">각 12자 이상, 두 번째 답에는 '넓이'를 넣어 주세요.</p></div>`}
// 4단계
let pi=0;
function v4(){const p=prob(pi),lab=p.ar.map((v,j)=>j===p.h?'?':v),ok=String(D.app.ans[pi]??'')===String(p.ans),qs=['처음에는 이 정사각형의 넓이를 어떻게 구하려 했나요?','지금은 어떤 관계를 이용하여 구할 수 있나요?','왜 그 관계를 이용할 수 있는지 설명해 볼까요?'];
 $('#mn').innerHTML=`<div class="c left"><div class="row">${[0,1,2,3,4,5].map(i=>`<button class="${i===pi?'on':''}" onclick="pi=${i};v4();upd()">문제 ${i+1}${String(D.app.ans[i]??'')==String(prob(i).ans)?' ✓':''}</button>`).join('')}</div><div class="fig">${triSvg(p.p,p.q,p.c,-1,lab,0)}</div><div class="small">아래·왼쪽 정사각형은 직각변, 오른쪽 위 큰 정사각형은 빗변에 붙어 있어요. 숫자는 정사각형의 넓이예요.</div></div>
 <div class="c right"><b>? 에 들어갈 넓이는?</b><div class="row"><input id="an" inputmode="numeric" value="${esc(D.app.ans[pi]??'')}" oninput="D.app.ans[pi]=this.value.trim();fb();save()" onchange="lg(4,'ans${pi}',this.value)" style="width:110px"><span id="fb"></span></div>
 ${qs.map((t,i)=>`<label>${i+1}. ${t}</label><textarea rows="2" oninput="D.app.r[${i}]=this.value;upd();save()" onchange="lg(4,'r${i}',this.value)">${esc(D.app.r[i])}</textarea>`).join('')}<p class="small">6문제 모두 정답 + 서술 3개(각 12자 이상)</p></div>`;fb()}
function fb(){const p=prob(pi),v=D.app.ans[pi],f=$('#fb');if(f)f.innerHTML=!v?'':String(v)==String(p.ans)?'<span class="ok">✓ 정답</span>':'<span class="no">다시 생각해 봐요</span>';upd()}
// ---------- 교사 ----------
let TK=sessionStorage.getItem('tk'),LIST=[],poll;
function loginT(){if(TK)return dash();A.innerHTML=`<div class="ctr c" style="padding:24px"><h2 style="margin-top:0">교사 인증</h2>${warn()}<input id="pw" type="password" placeholder="교사용 비밀번호"><p id="er" class="no"></p><button class="p" id="go" ${cfgOk?'':'disabled'}>확인</button></div>`;
 $('#go').onclick=async()=>{try{const t=await rpc('teacher_login',{p_pw:$('#pw').value});if(!t){$('#er').textContent='비밀번호가 올바르지 않습니다.';return}TK=t;sessionStorage.setItem('tk',t);dash()}catch(e){$('#er').textContent='오류: '+e.message}}}
let fq='',ff=0;
async function dash(){A.innerHTML=`<header><b>교사용 대시보드</b><span class="small" id="ts"></span><button onclick="dl()">CSV 다운로드</button><button onclick="sessionStorage.removeItem('tk');location.reload()">나가기</button></header><div class="dash" id="dv"></div>`;await load();clearInterval(poll);poll=setInterval(()=>{if(!$('#det'))load()},10000)}
async function load(){try{LIST=await rpc('teacher_list',{p_token:TK});$('#ts').textContent='갱신: '+new Date().toLocaleTimeString()+' (10초마다 자동 조회)';drawT()}catch(e){if(/unauthorized/.test(e.message)){sessionStorage.removeItem('tk');location.reload()}else $('#dv').innerHTML='<p class="no">불러오기 실패: '+esc(e.message)+'</p>'}}
const online=s=>Date.now()-new Date(s.last_seen)<90000;
function drawT(){const L=LIST.filter(s=>(s.no+s.name).includes(fq)&&(!ff||s.max_step==ff&&!s.completed||(ff==5&&s.completed)));const cnt=n=>LIST.filter(s=>!s.completed&&s.max_step==n).length;
 $('#dv').innerHTML=`<div class="stats"><div class="c"><b>${LIST.length}</b>전체 학생</div><div class="c"><b>${LIST.filter(online).length}</b>접속 중</div><div class="c"><b>${LIST.filter(s=>s.completed).length}</b>학습 완료</div><div class="c">${NAMES.map((n,i)=>`${n}: <b style="display:inline;font-size:14px">${cnt(i+1)}</b>`).join('<br>')}</div></div>
 <div class="row" style="margin-bottom:8px"><input style="max-width:220px" placeholder="학번·이름 검색" value="${esc(fq)}" oninput="fq=this.value;drawT();$('#dv input').focus();const i=$('#dv input');i.setSelectionRange(99,99)"><select onchange="ff=+this.value;drawT()" style="padding:6px;border-radius:8px">${['전체','1단계','2단계','3단계','4단계','완료'].map((n,i)=>`<option value="${i}" ${i==ff?'selected':''}>${n}</option>`).join('')}</select></div>
 <table><tr><th>학번</th><th>이름</th><th>현재 단계</th><th>상태</th><th>마지막 활동</th></tr>${L.map(s=>`<tr class="h" onclick="detail('${s.id}')"><td>${esc(s.no)}</td><td>${esc(s.name)}</td><td>${s.max_step}</td><td>${s.completed?'완료':online(s)?'접속 중':'오프라인'}</td><td>${new Date(s.updated_at).toLocaleString()}</td></tr>`).join('')}</table>`}
let rp;
async function detail(id){const s=LIST.find(x=>x.id==id);let E=[];try{E=await rpc('teacher_events',{p_token:TK,p_sid:id})}catch(e){alert(e.message);return}
 const g=s.data,o=g.obs||{a:{},extra:[]},r=g.rel||{},ap=g.app||{ord:[],ans:{},r:[]};D=ap.ord?.length?{app:ap,obs:o}:{app:{ord:[],ans:{},r:[]},obs:o};
 const hist=st=>E.filter(e=>e.kind=='ans'&&e.step==st).map(e=>`<div class="small">${new Date(e.at).toLocaleTimeString()} · ${esc(e.payload.k)}: ${esc(e.payload.v)}</div>`).join('')||'<div class="small">수정 기록 없음</div>';
 const rows1=ALL.filter(t=>BASE.includes(t)||(o.extra||[]).includes(key(t))).map(t=>{const v=o.a?.[key(t)]||[];return`<tr><td>${t.join(', ')}${BASE.includes(t)?'':' (추가)'}</td>${[0,1,2].map(j=>{const ok=String(v[j]??'')==String(t[j]**2);return`<td class="${ok?'ok':'no'}">${esc(v[j]??'—')} ${ok?'✓':'✗'}</td>`}).join('')}</tr>`}).join('');
 const T=r.t||T1,a=an(T),moves=E.filter(e=>e.step==2&&['move','rotate','reset','compare'].includes(e.kind));
 const pr=ap.ord?.length?[0,1,2,3,4,5].map(k=>{D.app=ap;const p=prob(k),v=ap.ans?.[k];return`<tr><td>${k+1}</td><td>${p.p}, ${p.q}, ${p.c}</td><td>${p.ar.map((x,j)=>j==p.h?'?':x).join(' / ')}</td><td>${esc(v??'—')}</td><td class="${String(v)==String(p.ans)?'ok':'no'}">${String(v)==String(p.ans)?'정답':'오답/미입력'}</td></tr>`}).join(''):'';
 A.innerHTML=`<header><button onclick="dash()">← 목록</button><b>${esc(s.no)} ${esc(s.name)}</b><span class="small">${s.completed?'수업 완료':'진행 중 (열린 단계 '+s.max_step+')'}</span></header><div class="dash" id="det">
 <h3>1단계 관찰하기</h3><table><tr><th>삼각형</th><th>한 직각변 쪽</th><th>다른 직각변 쪽</th><th>빗변 쪽</th></tr>${rows1}</table><p><b>추측 원문</b><br>${esc(o.guess||'—')}</p>${hist(1)}
 <h3>2단계 관계 발견하기</h3><div style="display:flex;gap:16px;flex-wrap:wrap"><div style="width:240px;height:240px">${svg2(T,a)}<div class="small" id="rpc">최종 배치: ${a.kind=='arr2'?'두 번째 배치 완성':a.kind=='arr1'?'첫 번째 배치':a.kind=='bad'?'겹침/이탈':'기타'} · 비교 ${r.cmp?'완료':'미완료'}</div></div>
 <div style="flex:1;min-width:260px"><div class="row"><button onclick='replay(${JSON.stringify(moves)})'>조작 과정 재생 (${moves.length}개 이벤트)</button></div><div style="width:240px;height:240px" id="rp">${svg2(T1,an(T1))}</div><table>${T.map((t,i)=>`<tr><td>삼각형 ${i+1}</td><td>위치(${t.x},${t.y})</td><td>${t.r*90}° 회전</td></tr>`).join('')}</table></div></div>
 <h3>3단계 생각 정리하기</h3><p><b>공통으로 유지되는 것</b><br>${esc(r.t1||'—')}</p><p><b>남는 부분 넓이의 관계</b><br>${esc(r.t2||'—')}</p>${hist(3)}
 <h3>4단계 적용하기</h3><table><tr><th>번호</th><th>삼각형</th><th>주어진 넓이</th><th>학생 답</th><th>결과</th></tr>${pr}</table>${(ap.r||[]).map((t,i)=>`<p><b>서술 ${i+1}</b><br>${esc(t||'—')}</p>`).join('')}${hist(4)}</div>`}
function replay(mv){clearInterval(rp);let T=T1.map(t=>({...t})),i=0;const box=$('#rp');rp=setInterval(()=>{if(i>=mv.length){clearInterval(rp);return}const e=mv[i++];if(e.kind=='reset')T=T1.map(t=>({...t}));else if(e.kind=='move'||e.kind=='rotate')T[e.payload.i]={x:e.payload.x,y:e.payload.y,r:e.payload.r};box.innerHTML=svg2(T,an(T))+`<div class="small">${i}/${mv.length} · ${new Date(e.at).toLocaleTimeString()} · ${e.kind}</div>`},700)}
function dl(){const H=['학번','이름','열린단계','완료','마지막활동','넓이입력(삼각형:a/b/c)','추가삼각형','추측','2단계 배치','비교','생각정리1','생각정리2','문제답(번호:삼각형:답:정오)','서술1','서술2','서술3'];
 const rows=LIST.map(s=>{const g=s.data,o=g.obs||{a:{},extra:[]},r=g.rel||{},ap=g.app||{ord:[],ans:{},r:[]};D={app:ap};const a=an(r.t||T1);
  return[s.no,s.name,s.max_step,s.completed?'Y':'N',s.updated_at,Object.entries(o.a||{}).map(([k,v])=>k+':'+v.join('/')).join(' | '),(o.extra||[]).join(','),o.guess,a.kind,r.cmp?'Y':'N',r.t1,r.t2,
  (ap.ord?.length?[0,1,2,3,4,5].map(k=>{const p=prob(k);return`${k+1}:${p.p}-${p.q}-${p.c}:${ap.ans?.[k]??''}:${String(ap.ans?.[k])==String(p.ans)?'O':'X'}`}).join(' | '):''),...(ap.r||['','',''])]});
 const q2=v=>'"'+String(v??'').replace(/"/g,'""')+'"',blob=new Blob(['\ufeff'+[H,...rows].map(r=>r.map(q2).join(',')).join('\n')],{type:'text/csv'}),u=document.createElement('a');u.href=URL.createObjectURL(blob);u.download='pythagoras_activity.csv';u.click()}
</script></body></html>
